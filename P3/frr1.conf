hostname R1
service integrated-vtysh-config #Tells FRR to use a single unified config file (instead of separate files per daemon like ospfd.conf, zebra.conf)

interface eth0
 ip address 1.0.0.1/30

interface eth1
 ip address 1.0.0.5/30

interface eth2
 ip address 1.0.0.9/30

router ospf
 network 1.0.0.0/30 area 0
 network 1.0.0.4/30 area 0
 network 1.0.0.8/30 area 0