hostname R4
service integrated-vtysh-config

!
! Interfaces
!

interface eth2
 ip address 1.0.0.10/30

interface lo
 ip address 10.0.0.4/32

!
! OSPF Underlay
!

router ospf
 network 1.0.0.8/30 area 0
 network 10.0.0.4/32 area 0

!
! iBGP
!

router bgp 65000
 bgp router-id 10.0.0.4

 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo

 address-family ipv4 unicast
  network 10.0.0.4/32
 exit-address-family

 !
 ! EVPN — activate session with RR and advertise all local VNIs (generates type-2/type-3 routes)
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
